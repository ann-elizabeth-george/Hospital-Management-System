{% extends "base.html" %}

{% block content %}
<div class="header">
    <h1>Patient Management</h1>
</div>

<div class="card">
    <h2>Add New Patient</h2>
    <form action="{{ url_for('patients') }}" method="POST">
        <div class="form-grid">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Enter name" required>
            </div>
            <div class="input-group">
                <label>Age</label>
                <input type="number" name="age" placeholder="Age" required>
            </div>
            <div class="input-group">
                <label>Gender</label>
                <select name="gender" required>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="input-group" style="justify-content: flex-end;">
                <button type="submit" class="btn btn-primary">Add Patient</button>
            </div>
        </div>
    </form>
</div>

<div class="card">
    <h2>Patient List</h2>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for p in patients %}
                <tr>
                    <td>#{{ p.patient_id }}</td>
                    <td>{{ p.name }}</td>
                    <td>{{ p.age }}</td>
                    <td>{{ p.gender }}</td>
                    <td>
                        <a href="{{ url_for('delete_patient', id=p.patient_id) }}" class="btn btn-danger" style="text-decoration: none; padding: 0.5rem 1rem;">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
