{% extends "base.html" %}

{% block content %}
<div class="header">
    <h1>Doctor Management</h1>
</div>

<div class="card">
    <h2>Add New Doctor</h2>
    <form action="{{ url_for('doctors') }}" method="POST">
        <div class="form-grid">
            <div class="input-group">
                <label>Doctor Name</label>
                <input type="text" name="name" placeholder="Dr. Name" required>
            </div>
            <div class="input-group">
                <label>Specialization</label>
                <input type="text" name="specialization" placeholder="e.g. Cardiology" required>
            </div>
            <div class="input-group" style="justify-content: flex-end;">
                <button type="submit" class="btn btn-primary">Add Doctor</button>
            </div>
        </div>
    </form>
</div>

<div class="card">
    <h2>Doctor List</h2>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Specialization</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for d in doctors %}
                <tr>
                    <td>#{{ d.doctor_id }}</td>
                    <td>{{ d.name }}</td>
                    <td>{{ d.specialization }}</td>
                    <td>
                        <a href="{{ url_for('delete_doctor', id=d.doctor_id) }}" class="btn btn-danger" style="text-decoration: none; padding: 0.5rem 1rem;">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
